<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambiar contraseña - ImagTEM</title>
<style>
body{font-family:system-ui,sans-serif;background:#f0f2f5;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px}.card{background:white;padding:25px;border-radius:14px;box-shadow:0 4px 20px #0002;width:min(360px,100%)}h2{margin-top:0}input,button{width:100%;padding:12px;margin-top:10px;box-sizing:border-box;border-radius:6px}input{border:1px solid #dadce0}button{border:0;background:#4285f4;color:white;font-weight:bold;cursor:pointer}.msg{margin-top:14px;font-size:13px;font-weight:bold}
</style>
</head>
<body>
<div class="card"><h2>Cambiar contraseña</h2><p>Escribe una contraseña nueva para tu cuenta.</p><input id="password" type="password" minlength="8" placeholder="Nueva contraseña"><button id="save">Guardar contraseña</button><div id="msg" class="msg"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient=window.supabase.createClient('https://sqppvkeorapvhcjyjteu.supabase.co','sb_publishable_537l912kRN5B7ghGctu2ZA_Qnb8ZwQF');
const msg=document.getElementById('msg');
function show(t,error=false){msg.textContent=t;msg.style.color=error?'#ea4335':'#34a853';}
async function ready(){const {data:{session}}=await supabaseClient.auth.getSession(); if(!session) show('El enlace no es válido o ya venció.',true);}
supabaseClient.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY') show('Enlace válido. Elige una contraseña nueva.');});
document.getElementById('save').onclick=async()=>{const password=document.getElementById('password').value;if(password.length<8){show('Usa al menos 8 caracteres.',true);return;}const {error}=await supabaseClient.auth.updateUser({password});if(error)show('No se pudo cambiar la contraseña.',true);else{show('Contraseña actualizada. Ya puedes cerrar esta página.');await supabaseClient.auth.signOut();}};
ready();
</script>
</body>
</html>
